name: Deploy to Hostinger via FTP

on:
  push:
    branches:
      - main # Triggers the deployment whenever you push to the main branch

jobs:
  web-deploy:
    name: Deploy to Hostinger
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Sync files
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # The folder on Hostinger where the app should be uploaded (e.g., public_html/clinic)
          server-dir: public_html/clinic/
          exclude: |
            **/.git*
            **/.git*/**
            **/create_tenant.php
            **/check_*.php
            **/.DS_Store
